<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Turbo Tumble" />
    <meta name="theme-color" content="#2a7fd4" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="icon" href="icons/icon-192.png" type="image/png" />
    <title>Turbo Tumble Racers</title>
    <style>
      html, body {
        margin: 0; padding: 0; height: 100%; overflow: hidden;
        background: #2a7fd4;
        position: fixed; inset: 0;
        touch-action: none;
        -webkit-user-select: none; user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior: none;
      }
      /* The canvas always covers the whole screen; its pixel size is measured from this box. */
      canvas { display: block; touch-action: none; position: fixed; inset: 0; width: 100%; height: 100%; }
      #gl { z-index: 0; }
      #game { z-index: 1; }
      #boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 2; pointer-events: none; }
      #boot div { width: 64px; height: 64px; border-radius: 50%; border: 10px solid #fff; border-top-color: #ffcc1a; animation: spin 0.8s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      #safe {
        position: fixed; visibility: hidden; pointer-events: none;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      }
    </style>
  </head>
  <body>
    <canvas id="gl"></canvas>
    <canvas id="game"></canvas>
    <div id="boot"><div></div></div>
    <div id="safe"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
